[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iot-intrusion-backend"
version = "0.1.0"
description = "FastAPI backend for the IoT intrusion detection system"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.135,<1",
  "starlette>=1,<2",
  "pydantic>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
  "joblib>=1.4,<2",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
  "scipy>=1.12,<2",
  "shap>=0.50,<1",
  "pwdlib[argon2]>=0.3,<1",
  "PyJWT>=2.10,<3",
  "prometheus-client>=0.25,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
pcap = ["nfstream>=6.6,<7"]
dev = [
  "httpx>=0.27,<1",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "postgres: integration tests that require IOT_IDS_TEST_POSTGRES_URL",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
