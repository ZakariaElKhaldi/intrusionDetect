x-runtime-security: &runtime-security
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:mode=1777

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: iot_ids
      POSTGRES_USER: iot_ids
      POSTGRES_PASSWORD: "${IOT_IDS_POSTGRES_PASSWORD:?set a random URL-safe PostgreSQL password}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot_ids"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  migration:
    <<: *runtime-security
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: &backend-environment
      IOT_IDS_DATABASE_URL: "postgresql+psycopg://iot_ids:${IOT_IDS_POSTGRES_PASSWORD:?set a random URL-safe PostgreSQL password}@database:5432/iot_ids"
      IOT_IDS_MODEL_DIR: /app/models/production
      IOT_IDS_DATASET_PATH: /app/data/raw/RT_IOT2022.csv
      IOT_IDS_SCHEMA_PATH: /app/data/schema/rt_iot2022_v1.json
      IOT_IDS_ALLOW_FALLBACK: "false"
      IOT_IDS_CORS_ORIGINS: http://localhost:5173
      IOT_IDS_ALLOWED_HOSTS: "${IOT_IDS_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      IOT_IDS_INGESTION_QUEUE_LIMIT: "10000"
      IOT_IDS_WORKER_POLL_SECONDS: "0.5"
      IOT_IDS_WORKER_LEASE_SECONDS: "60"
      IOT_IDS_OUTBOX_POLL_SECONDS: "0.5"
      IOT_IDS_MAX_REQUEST_BODY_BYTES: "${IOT_IDS_MAX_REQUEST_BODY_BYTES:-52428800}"
      IOT_IDS_MAX_LIVE_CONNECTIONS: "${IOT_IDS_MAX_LIVE_CONNECTIONS:-250}"
      IOT_IDS_AUTH_ENABLED: "${IOT_IDS_AUTH_ENABLED:-true}"
      IOT_IDS_ADMIN_USERNAME: "${IOT_IDS_ADMIN_USERNAME:-admin}"
      IOT_IDS_ADMIN_PASSWORD_HASH: "${IOT_IDS_ADMIN_PASSWORD_HASH:?generate an Argon2id hash first}"
      IOT_IDS_SECRET_KEY: "${IOT_IDS_SECRET_KEY:?set a random secret of at least 32 bytes}"
      IOT_IDS_ACCESS_TOKEN_MINUTES: "${IOT_IDS_ACCESS_TOKEN_MINUTES:-30}"
    depends_on:
      database:
        condition: service_healthy

  backend:
    <<: *runtime-security
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-environment
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      migration:
        condition: service_completed_successfully

  worker:
    <<: *runtime-security
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.ingestion.worker"]
    environment: *backend-environment
    restart: unless-stopped
    depends_on:
      migration:
        condition: service_completed_successfully
      backend:
        condition: service_started

  frontend:
    <<: *runtime-security
    build:
      context: frontend
    ports:
      - "5173:8080"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
